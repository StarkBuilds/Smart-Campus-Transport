# ========================
# Application
# ========================
spring.application.name=smart-campus-transport

# ========================
# PostgreSQL (Docker Compose)
# ========================
spring.datasource.url=jdbc:postgresql://localhost:5432/smart_campus
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========================
# Server
# ========================
server.port=8080

# ========================
# ML Service
# ========================
ml.service.url=${ML_SERVICE_URL:http://localhost:5000}
ml.service.timeout-ms=${ML_SERVICE_TIMEOUT:5000}

# ========================
# JWT
# ========================
jwt.secret=${JWT_SECRET}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# ========================
# OAuth2 Security (Google & GitHub)
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
